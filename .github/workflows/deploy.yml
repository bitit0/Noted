name: Deploy to GitHub Pages

# Builds the Vite app and publishes it to GitHub Pages.
# One-time setup in the repo: Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
on:
  push:
    branches: [main, overhaul] # overhaul holds the current work; drop it once merged to main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run supersede an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /Noted/ # project site path: https://<user>.github.io/Noted/
      # GitHub Pages has no SPA rewrite; serve index.html for unknown deep links.
      - run: cp build/index.html build/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
